<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Book</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Recipe Book</h1>
    </header>

    <!-- Home Page -->
    <section id="homePage" class="home-section">
        <div class="home-content">
            <h2>Welcome to Your Recipe Book 🍲</h2>

            <p>
                Store, view, and manage your favorite recipes —
                all in one place!
            </p>

            <div class="home-buttons">
                <button id="goToAdd">
                    Click here to add Recipe
                </button>

                <button id="goToView">
                    📖 View Recipes
                </button>
            </div>
        </div>
    </section>

    <!-- Add Recipe Section -->
    <main id="appContent" style="display: none;">
        <section class="form-section">
            <h2>Add a Recipe</h2>

            <form id="recipeForm">

                <label for="name">Recipe Name</label>
                <input type="text" id="name" placeholder="Enter recipe name" required autocomplete="off" />

                <label for="ingredients">Ingredients</label>
                <textarea id="ingredients" placeholder="List ingredients (comma separated)" required
                    autocomplete="off"></textarea>

                <label for="steps">Preparation Steps</label>
                <textarea id="steps" placeholder="Write preparation steps" required autocomplete="off"></textarea>

                <label for="image">Recipe Image</label>
                <input type="file" id="image" accept="image/*" />

                <button type="submit">Add Recipe</button>

            </form>

        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
