<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Book</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Recipe Book</h1>
    </header>

    <!-- Home Page -->
    <section id="homePage" class="home-section">
        <div class="home-content">
            <h2>Welcome to Your Recipe Book 🍲</h2>

            <p>
                Store, view, and manage your favorite recipes —
                all in one place!
            </p>

            <div class="home-buttons">
                <button id="goToAdd">
                    Click here to add Recipe
                </button>

                <button id="goToView">
                    📖 View Recipes
                </button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
